name: Release - Tag, Publish and Back-merge
 
on:
  pull_request:
    types: [closed]
    branches: [main]
 
permissions:
  contents: write
 
jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
 
      - name: Extract version from branch name
        id: version
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          VERSION="v${BRANCH#*/}"
          echo "Version: $VERSION"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
 
      - name: Configure Git bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
 
      - name: Create and push annotated tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"; exit 1
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
 
      - name: Create GitHub Release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --title "Release $TAG" --generate-notes
 
      - name: Back-merge main into develop
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git checkout develop
          git merge --no-ff origin/main -m "chore: back-merge $TAG into develop"
          git push origin develop
