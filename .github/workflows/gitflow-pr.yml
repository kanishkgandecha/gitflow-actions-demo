name: Git Flow - Auto Open PR to main
 
on:
  push:
    branches: ['release/**', 'hotfix/**']
 
permissions:
  contents: read
  pull-requests: write
 
jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Create PR into main (if not already open)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          OPEN=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq 'length')
          if [ "$OPEN" = "0" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "Git Flow: merge $BRANCH into main" \
              --body "Automated PR created by GitHub Actions. Merging this will tag the version, publish a GitHub Release and back-merge into develop."
          else
            echo "PR already open for $BRANCH"
          fi
